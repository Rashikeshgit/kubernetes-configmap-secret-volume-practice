apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: python-app
        image: python-web-app:v1
        volumeMounts:
        - name: db-vol-connection
          mountPath: /opt
        ports:
          - containerPort: 8000
      volumes:
      - name: db-vol-connection
        configMap:
         name: volume-demo

